name: 🐛 Bug Report
description: File an issue with unexpected behavior or an error in SkyScout
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible to help us reproduce and resolve the issue.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package or App
      description: Which part of SkyScout is experiencing the bug?
      options:
        - "@skyscout/core (Astronomical Math & Utilities)"
        - "@skyscout/lasair-client (Lasair Rubin Broker Client)"
        - "skyscout (Explorer Web Dashboard)"
        - "Repository / Turborepo / CI / Build Pipeline"
        - "Documentation"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: e.g. fluxToAbMag produces an unexpected output when negative fluxes are passed...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code snippet or steps to trigger the bug.
      placeholder: |
        1. Initialize LasairClient with...
        2. Run client.query(...)
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, OS, browser, package manager
      placeholder: e.g. Node 20.17.0, Windows 11, Chrome 130
    validations:
      required: false

  - type: checkboxes
    id: checklists
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified this behavior on the latest release or `develop` branch.
          required: false
